<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Fondo gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d99;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rectángulo de fondo -->
  <rect width="640" height="360" fill="url(#grad1)"/>

  <!-- Icono de video (play) -->
  <circle cx="320" cy="180" r="60" fill="white" opacity="0.9"/>
  <polygon points="300,160 300,200 340,180" fill="#0066cc"/>

  <!-- Texto -->
  <text x="320" y="260" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.9">
    Videoteca SFX
  </text>
  <text x="320" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.7">
    Sin miniatura
  </text>
</svg>
