; Configuración PHP para subida de archivos grandes
; Para servidores con PHP-FPM

; Tamaño máximo de archivo subido (500MB)
upload_max_filesize = 500M
post_max_size = 500M

; Tiempo máximo de ejecución (10 minutos para procesamiento de videos)
max_execution_time = 600
max_input_time = 600

; Memoria máxima
memory_limit = 512M

; Habilitar registro de errores
log_errors = On
error_log = logs/php_errors.log

; Mostrar errores en desarrollo
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
